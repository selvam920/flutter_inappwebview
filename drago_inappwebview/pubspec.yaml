name: drago_inappwebview
description: A Flutter plugin that allows you to add an inline webview, to use an headless webview, and to open an in-app browser window.
version: 6.2.0-beta.3
homepage: https://inappwebview.dev/
repository: https://github.com/pichillilorenzo/flutter_inappwebview
issue_tracker: https://github.com/pichillilorenzo/flutter_inappwebview/issues
funding:
  - https://inappwebview.dev/donate/
topics:
  - html
  - webview
  - webview-flutter
  - inappwebview
  - browser

environment:
  sdk: ^3.8.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.0.0
  plugin_platform_interface: ^2.1.8
  cupertino_ui: any

  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.12
  generators:
    path: ../dev_packages/generators

# For information on the generic Dart part of this file, see the
# following page: https://www.dartlang.org/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  plugin:
    platforms:
      android:
        package: com.pichillilorenzo.drago_inappwebview
        pluginClass: InAppWebViewFlutterPlugin
        dartPluginClass: AndroidInAppWebViewPlatform
      ios:
        pluginClass: InAppWebViewFlutterPlugin
        dartPluginClass: IOSInAppWebViewPlatform
      macos:
        pluginClass: InAppWebViewFlutterPlugin
        dartPluginClass: MacOSInAppWebViewPlatform
      web:
        pluginClass: InAppWebViewFlutterPlugin
        fileName: platforms/web/web/main.dart
      windows:
        pluginClass: DragoInappwebviewPluginCApi
        dartPluginClass: WindowsInAppWebViewPlatform
      linux:
        pluginClass: DragoInappwebviewPlugin
        dartPluginClass: LinuxInAppWebViewPlatform

  assets:
    - packages/drago_inappwebview/assets/t_rex_runner/t-rex.html
    - packages/drago_inappwebview/assets/t_rex_runner/t-rex.css
    - packages/drago_inappwebview/platforms/web/assets/web/web_support.js
  # To add assets to your plugin package, add an assets section, like this:
  # assets:
  #  - images/a_dot_burr.jpeg
  #  - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.io/assets-and-images/#from-packages
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.io/assets-and-images/#resolution-aware.

  # To add custom fonts to your plugin package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.io/custom-fonts/#from-packages

false_secrets:
  - /test_node_server/*.pem
  - /test_node_server/*.pfx